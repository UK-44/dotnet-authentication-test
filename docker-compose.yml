services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Vite の proxy で /api をここに転送する
      API_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      # node_modules はコンテナ内のものを使う（ホストの macOS 用バイナリと混ざらないように）
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=app;User=app;Password=app_password"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
